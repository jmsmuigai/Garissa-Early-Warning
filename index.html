<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garissa County Steering Group Portal</title>
<meta http-equiv="refresh" content="0; url=./portal/">
<link rel="canonical" href="./portal/">
<script>
  // retire the old GEWAS service worker so visitors get the new portal
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()))
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)))
  location.replace('./portal/' + location.hash)
</script>
</head>
<body style="font-family:system-ui;background:#142338;color:#fff;padding:2rem">
<p>Opening the Garissa County Steering Group portal… <a style="color:#e8c07d" href="./portal/">Continue</a></p>
<p style="opacity:.7">Previous GEWAS dashboard: <a style="color:#e8c07d" href="./legacy/">legacy version</a></p>
</body>
</html>
